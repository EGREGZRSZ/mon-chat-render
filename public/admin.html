<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Admin - Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; display: flex; }
        
        #sidebar { width: 350px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.2rem; font-weight: bold; background: #0084ff; color: white; }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        #user-list li { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        #user-list li:hover, #user-list li.active { background: #f0f2f5; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background: linear-gradient(135deg, #00c6ff, #0072ff); flex-shrink: 0; }

        #chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #ddd; background: #fafafa; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 10px; background: #fdfdfd; }
        #messages li { padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; background: #e4e6eb; }
        #messages li.admin-msg { background: #0084ff; color: white; align-self: flex-end; }
        
        #chat-form { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fff; gap: 10px; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .no-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">Conversations Clients</div>
        <ul id="user-list">
            <li class="no-chat">Aucun client connecté</li>
        </ul>
    </div>

    <div id="chat-area">
        <div class="chat-header" id="current-chat-title">Sélectionnez une conversation à gauche</div>
        <ul id="messages"></ul>
        <form id="chat-form" style="display: none;">
            <input type="text" id="msg-input" placeholder="Répondre à ce client..." autocomplete="off" required />
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let activeUserId = null;
        let conversations = {};

        const userListUl = document.getElementById('user-list');
        const messagesUl = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const inputMsg = document.getElementById('msg-input');
        const chatTitle = document.getElementById('current-chat-title');

        socket.on('updateUserList', (users) => {
            userListUl.innerHTML = '';
            if (users.length === 0) {
                userListUl.innerHTML = '<li style="padding:20px; color:#888;">Aucun client en ligne</li>';
                return;
            }

            users.forEach(user => {
                if (!conversations[user.id]) {
                    conversations[user.id] = [];
                }
                const li = document.createElement('li');
                if (user.id === activeUserId) li.classList.add('active');
                
                // Affichage du nom et de l'ID unique automatique
                li.innerHTML = `
                    <div class="avatar">${user.pseudo.charAt(0).toUpperCase()}</div>
                    <div style="overflow:hidden;">
                        <strong>${user.pseudo}</strong>
                        <div style="font-size:0.75rem; color:#666; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">ID: ${user.id}</div>
                    </div>
                `;
                li.onclick = () => selectUser(user.id, user.pseudo);
                userListUl.appendChild(li);
            });
        });

        function selectUser(userId, pseudo) {
            activeUserId = userId;
            chatTitle.textContent = `Discussion avec ${pseudo} (ID: ${userId})`;
            chatForm.style.display = 'flex';
            renderMessages();
        }

        socket.on('newClientMessage', (data) => {
            if (!conversations[data.senderId]) {
                conversations[data.senderId] = [];
            }
            conversations[data.senderId].push({ author: data.author, text: data.text, type: 'client' });
            if (activeUserId === data.senderId) renderMessages();
        });

        socket.on('adminReplySent', (data) => {
            if (!conversations[data.targetSocketId]) {
                conversations[data.targetSocketId] = [];
            }
            conversations[data.targetSocketId].push({ author: data.author, text: data.text, type: 'admin' });
            if (activeUserId === data.targetSocketId) renderMessages();
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputMsg.value.trim();
            if (text && activeUserId) {
                socket.emit('adminReply', { targetSocketId: activeUserId, text });
                inputMsg.value = '';
            }
        });

        function renderMessages() {
            messagesUl.innerHTML = '';
            const msgs = conversations[activeUserId] || [];
            msgs.forEach(m => {
                const li = document.createElement('li');
                if (m.type === 'admin') li.classList.add('admin-msg');
                li.innerHTML = `<strong>${m.author} :</strong> ${m.text}`;
                messagesUl.appendChild(li);
            });
            messagesUl.scrollTop = messagesUl.scrollHeight;
        }
    </script>
</body>
</html>
