<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Admin - Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; display: flex; position: relative; overflow: hidden; }
        
        #sidebar { width: 380px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.2rem; font-weight: bold; background: #0084ff; color: white; }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        #user-list li { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        #user-list li:hover { background: #f7f8fa; }
        #user-list li.active { background: #e6f2ff; }
        
        .user-info { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background: linear-gradient(135deg, #00c6ff, #0072ff); flex-shrink: 0; }
        
        .user-details { overflow: hidden; flex: 1; }
        .user-details strong { display: block; font-size: 0.95rem; color: #050505; }
        .last-msg { font-size: 0.8rem; color: #65676b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        
        /* Indicateur de non-lu (Point vert ou badge style WhatsApp) */
        .unread-badge { background: #25d366; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        
        .delete-btn { background: #ff3b30; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; display: none; }
        #user-list li:hover .delete-btn { display: block; }
        .delete-btn:hover { background: #d32f2f; }

        #chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #ddd; background: #fafafa; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 10px; background: #fdfdfd; }
        #messages li { padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; background: #e4e6eb; }
        #messages li.admin-msg { background: #0084ff; color: white; align-self: flex-end; }
        #messages img, #messages video { max-width: 200px; border-radius: 6px; display: block; margin-top: 5px; }

        #chat-form { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fff; gap: 10px; align-items: center; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .file-btn { background: #e4e6eb; color: #333; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        button[type="submit"] { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        #notification-container { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none; }
        .toast { background: #242526; color: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); pointer-events: auto; display: flex; flex-direction: column; gap: 4px; min-width: 260px; animation: slideIn 0.3s ease-out; border-left: 5px solid #25d366; }
        .toast strong { color: #25d366; font-size: 0.95rem; }
        .toast span { font-size: 0.85rem; color: #b0b3b8; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        .no-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <div id="sidebar">
        <div class="sidebar-header">Conversations Clients</div>
        <ul id="user-list">
            <li class="no-chat">Aucun client connecté</li>
        </ul>
    </div>

    <div id="chat-area">
        <div class="chat-header" id="current-chat-title">Sélectionnez une conversation à gauche</div>
        <ul id="messages"></ul>
        <form id="chat-form" style="display: none;">
            <label class="file-btn" for="file-input">📁</label>
            <input type="file" id="file-input" style="display: none;" accept="image/*,video/*" />
            <input type="text" id="msg-input" placeholder="Répondre au client..." autocomplete="off" />
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let activeUserId = null;
        let conversations = {};

        const userListUl = document.getElementById('user-list');
        const messagesUl = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const inputMsg = document.getElementById('msg-input');
        const fileInput = document.getElementById('file-input');
        const chatTitle = document.getElementById('current-chat-title');
        const notifContainer = document.getElementById('notification-container');

        function showToast(title, text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<strong>${title}</strong><span>${text}</span>`;
            notifContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        socket.on('newUserNotification', (data) => {
            showToast("Nouveau client", `${data.pseudo} vient de se connecter.`);
        });

        socket.on('updateUserList', (users) => {
            userListUl.innerHTML = '';
            if (users.length === 0) {
                userListUl.innerHTML = '<li style="padding:20px; color:#888; justify-content:center;">Aucun client en ligne</li>';
                return;
            }

            users.forEach(user => {
                if (!conversations[user.id]) conversations[user.id] = [];
                const li = document.createElement('li');
                if (user.id === activeUserId) li.classList.add('active');
                
                // Affichage avec aperçu du dernier message et badge de non-lu si supérieur à 0
                li.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${user.pseudo.charAt(0).toUpperCase()}</div>
                        <div class="user-details">
                            <strong>${user.pseudo}</strong>
                            <div class="last-msg">${user.lastMessage || 'Aucun message'}</div>
                        </div>
                    </div>
                    ${user.unreadCount > 0 ? `<div class="unread-badge">${user.unreadCount}</div>` : ''}
                    <button class="delete-btn" title="Supprimer la conversation">Supprimer</button>
                `;

                li.querySelector('.user-info').onclick = () => selectUser(user.id, user.pseudo);
                
                li.querySelector('.delete-btn').onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`Voulez-vous vraiment supprimer la conversation avec ${user.pseudo} ?`)) {
                        socket.emit('deleteConversation', user.id);
                        delete conversations[user.id];
                        if (activeUserId === user.id) {
                            activeUserId = null;
                            chatTitle.textContent = "Sélectionnez une conversation à gauche";
                            messagesUl.innerHTML = '';
                            chatForm.style.display = 'none';
                        }
                    }
                };

                userListUl.appendChild(li);
            });
        });

        function selectUser(userId, pseudo) {
            activeUserId = userId;
            chatTitle.textContent = `Discussion avec ${pseudo}`;
            chatForm.style.display = 'flex';
            socket.emit('markAsRead', userId); // Réinitialise le compteur de non-lus
            renderMessages();
        }

        socket.on('newClientMessage', (data) => {
            if (!conversations[data.senderId]) conversations[data.senderId] = [];
            conversations[data.senderId].push({ author: data.author, text: data.text, file: data.file, fileType: data.fileType, type: 'client' });
            
            if (activeUserId === data.senderId) {
                renderMessages();
            } else {
                showToast(`Message de ${data.author}`, data.text || '[Fichier multimédia]');
            }
        });

        socket.on('adminReplySent', (data) => {
            if (!conversations[data.targetSocketId]) conversations[data.targetSocketId] = [];
            conversations[data.targetSocketId].push({ author: data.author, text: data.text, file: data.file, fileType: data.fileType, type: 'admin' });
            if (activeUserId === data.targetSocketId) renderMessages();
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputMsg.value.trim();
            const file = fileInput.files[0];

            if ((text || file) && activeUserId) {
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        socket.emit('adminReply', { targetSocketId: activeUserId, text, file: event.target.result, fileType: file.type });
                        resetForm();
                    };
                    reader.readAsDataURL(file);
                } else {
                    socket.emit('adminReply', { targetSocketId: activeUserId, text, file: null, fileType: null });
                    resetForm();
                }
            }
        });

        function resetForm() {
            inputMsg.value = '';
            fileInput.value = '';
        }

        function renderMessages() {
            messagesUl.innerHTML = '';
            const msgs = conversations[activeUserId] || [];
            msgs.forEach(m => {
                const li = document.createElement('li');
                if (m.type === 'admin') li.classList.add('admin-msg');
                let content = `<strong>${m.author} :</strong> ${m.text}`;
                if (m.file) {
                    if (m.fileType.startsWith('image/')) content += `<img src="${m.file}"/>`;
                    else if (m.fileType.startsWith('video/')) content += `<video src="${m.file}" controls></video>`;
                }
                li.innerHTML = content;
                messagesUl.appendChild(li);
            });
            messagesUl.scrollTop = messagesUl.scrollHeight;
        }
    </script>
</body>
</html>
