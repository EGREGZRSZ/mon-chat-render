<!DOCTYPE html>
<html lang="fr" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Muchacha - Support Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Animation subtile de flottaison pour le bouton */
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Transition douce pour l'apparition de la fenêtre de chat */
    .chat-window {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="relative h-full w-full select-none">

  <!-- 1. Site Web Cible en Plein Écran (Iframe Arrière-plan) -->
  <iframe 
    src="https://pinkmuchacha.com/" 
    class="w-full h-full border-none outline-none m-0 p-0 block absolute inset-0 z-0"
    title="Pink Muchacha"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- 2. Fenêtre de Chat Flottante (Masquée par défaut) -->
  <div 
    id="chat-container"
    class="chat-window fixed bottom-24 right-6 z-50 opacity-0 pointer-events-none scale-95 translate-y-4 w-[380px] h-[580px] max-w-[90vw] max-h-[80vh] rounded-3xl overflow-hidden shadow-2xl border border-white/20 bg-black/40 backdrop-blur-md"
  >
    <!-- Entête de la fenêtre de chat avec bouton de fermeture -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-4 py-3 text-white flex justify-between items-center shadow-md">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
        <span class="font-semibold text-sm">Support en direct</span>
      </div>
      <button 
        onclick="toggleChat()" 
        class="text-white/80 hover:text-white text-xl font-bold p-1 leading-none transition-colors"
        title="Fermer le chat"
      >
        ✕
      </button>
    </div>

    <!-- Iframe appelant votre chat Socket.IO hébergé sur Render -->
    <iframe 
      src="https://mon-chat-render.onrender.com/" 
      class="w-full h-[calc(100%-48px)] border-none"
      title="Fenêtre de discussion"
    ></iframe>
  </div>

  <!-- 3. Bouton Flottant en Bas à Droite (Bulle/Logo) -->
  <div class="fixed bottom-6 right-6 z-50">
    <button 
      onclick="toggleChat()" 
      class="animate-float flex items-center justify-center p-4 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-2xl transition-transform duration-300 hover:scale-110 active:scale-95 cursor-pointer outline-none"
      title="Ouvrir le chat de support"
    >
      <!-- Icône du Chat (Remplaçable par un SVG ou une image) -->
      <svg id="chat-icon" class="w-8 h-8 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
      </svg>
    </button>
  </div>

  <!-- 4. Script JavaScript pour ouvrir / fermer le Chat -->
  <script>
    let isChatOpen = false;

    function toggleChat() {
      const chatContainer = document.getElementById('chat-container');
      isChatOpen = !isChatOpen;

      if (isChatOpen) {
        // Afficher la fenêtre de chat
        chatContainer.classList.remove('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-4');
        chatContainer.classList.add('opacity-100', 'pointer-events-auto', 'scale-100', 'translate-y-0');
      } else {
        // Masquer la fenêtre de chat
        chatContainer.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100', 'translate-y-0');
        chatContainer.classList.add('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-4');
      }
    }
  </script>

</body>
</html>
