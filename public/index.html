<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Client - Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 400px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 550px; }
        .chat-header { background: #0084ff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; list-style-type: none; display: flex; flex-direction: column; gap: 8px; }
        #messages li { padding: 10px 14px; border-radius: 8px; background: #e4e6eb; max-width: 85%; word-break: break-word; }
        #messages li.admin { background: #0084ff; color: white; align-self: flex-start; }
        #messages li.self { background: #0084ff; color: white; align-self: flex-end; }
        #chat-form { display: flex; border-top: 1px solid #dee2e6; padding: 10px; background: #fff; gap: 8px; }
        #msg-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { padding: 10px 16px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="chat-header">💬 Discussion avec le Support</div>
        <ul id="messages"></ul>
        <form id="chat-form">
            <input type="text" id="msg-input" placeholder="Écrivez votre message..." autocomplete="off" required />
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        // Plus de demande de pseudo, le serveur l'attribue automatiquement à la connexion !

        const form = document.getElementById('chat-form');
        const inputMsg = document.getElementById('msg-input');
        const messagesUl = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputMsg.value.trim();
            if (text) {
                socket.emit('clientMessage', { text });
                
                // Affichage local immédiat
                const li = document.createElement('li');
                li.className = 'self';
                li.textContent = text;
                messagesUl.appendChild(li);
                messagesUl.scrollTop = messagesUl.scrollHeight;
                
                inputMsg.value = '';
            }
        });

        // Réception de la réponse du support admin
        socket.on('privateMessage', (data) => {
            const li = document.createElement('li');
            li.className = 'admin';
            li.innerHTML = `<strong>${data.author} :</strong> ${data.text}`;
            messagesUl.appendChild(li);
            messagesUl.scrollTop = messagesUl.scrollHeight;
        });
    </script>
</body>
</html>
